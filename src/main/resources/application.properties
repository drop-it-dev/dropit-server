spring.application.name=dropit-server

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:200ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:200ms}

jwt.secret=${JWT_SECRET}
jwt.expire.access=30m
jwt.expire.refresh=14d

management.endpoints.web.exposure.include=health

# AWS
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET}
aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL}

# CloudFront CDN
app.cdn.domain=${AWS_CLOUDFRONT_DOMAIN}

# SQS - order
app.order.sqs.order-queue-url=${AWS_SQS_ORDER_QUEUE_URL:}
app.order.sqs.consumer-enabled=${AWS_SQS_CONSUMER_ENABLED:false}
app.order.sqs.consumer-concurrency=${AWS_SQS_CONSUMER_CONCURRENCY:2}
app.order.sqs.consumer-max-number-of-messages=${AWS_SQS_CONSUMER_MAX_NUMBER_OF_MESSAGES:2}
app.order.sqs.consumer-wait-time-seconds=${AWS_SQS_CONSUMER_WAIT_TIME_SECONDS:10}
app.order.sqs.consumer-visibility-timeout-seconds=${AWS_SQS_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:60}
app.order.sqs.publisher-timeout-millis=${AWS_SQS_PUBLISHER_TIMEOUT_MILLIS:3000}

# SQS - purchase success email
app.notification.email.sqs.queue-url=${AWS_SQS_PURCHASE_EMAIL_QUEUE_URL:}
app.notification.email.sqs.publisher-enabled=${AWS_SQS_PURCHASE_EMAIL_PUBLISHER_ENABLED:false}
app.notification.email.sqs.publisher-timeout-millis=${AWS_SQS_PURCHASE_EMAIL_PUBLISHER_TIMEOUT_MILLIS:3000}
app.notification.email.sqs.relay-batch-size=${AWS_SQS_PURCHASE_EMAIL_RELAY_BATCH_SIZE:50}
app.notification.email.sqs.relay-delay-millis=${AWS_SQS_PURCHASE_EMAIL_RELAY_DELAY_MILLIS:1000}
app.notification.email.sqs.claim-timeout-millis=${AWS_SQS_PURCHASE_EMAIL_CLAIM_TIMEOUT_MILLIS:30000}
app.notification.email.sqs.retry-delay-millis=${AWS_SQS_PURCHASE_EMAIL_RETRY_DELAY_MILLIS:5000}
app.notification.email.sqs.consumer-enabled=${AWS_SQS_PURCHASE_EMAIL_CONSUMER_ENABLED:false}
app.notification.email.sqs.consumer-concurrency=${AWS_SQS_PURCHASE_EMAIL_CONSUMER_CONCURRENCY:2}
app.notification.email.sqs.consumer-max-number-of-messages=${AWS_SQS_PURCHASE_EMAIL_CONSUMER_MAX_NUMBER_OF_MESSAGES:2}
app.notification.email.sqs.consumer-wait-time-seconds=${AWS_SQS_PURCHASE_EMAIL_CONSUMER_WAIT_TIME_SECONDS:10}
app.notification.email.sqs.consumer-visibility-timeout-seconds=${AWS_SQS_PURCHASE_EMAIL_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:60}

# SES - purchase success email
app.notification.email.ses.from-address=${AWS_SES_FROM_ADDRESS:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger UI Basic Auth credentials
docs.auth.username=${DOCS_AUTH_USERNAME}
docs.auth.password=${DOCS_AUTH_PASSWORD}
