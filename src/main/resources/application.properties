spring.application.name=dropit-server

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

jwt.secret=${JWT_SECRET}
jwt.expire.access=30m
jwt.expire.refresh=14d

management.endpoints.web.exposure.include=health

# AWS
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# SQS - order
app.order.sqs.order-queue-url=${AWS_SQS_ORDER_QUEUE_URL}
app.order.sqs.consumer-enabled=${AWS_SQS_CONSUMER_ENABLED:false}
app.order.sqs.consumer-concurrency=${AWS_SQS_CONSUMER_CONCURRENCY:2}
app.order.sqs.consumer-max-number-of-messages=${AWS_SQS_CONSUMER_MAX_NUMBER_OF_MESSAGES:2}
app.order.sqs.consumer-wait-time-seconds=${AWS_SQS_CONSUMER_WAIT_TIME_SECONDS:20}
app.order.sqs.consumer-visibility-timeout-seconds=${AWS_SQS_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:60}
app.order.sqs.consumer-initial-delay=${AWS_SQS_CONSUMER_INITIAL_DELAY:1000}
app.order.sqs.consumer-poll-delay=${AWS_SQS_CONSUMER_POLL_DELAY:1000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger UI Basic Auth credentials
docs.auth.username=${DOCS_AUTH_USERNAME}
docs.auth.password=${DOCS_AUTH_PASSWORD}
