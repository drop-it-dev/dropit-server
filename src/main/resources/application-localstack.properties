# Run together with the local profile:
# --spring.profiles.active=local,localstack

# Keep the disposable end-to-end test schema separate from the developer's
# normal local data. The common profile currently uses ddl-auto=create.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${LOCALSTACK_DB_NAME:dropit_localstack}

# LocalStack accepts dummy credentials. They are not real AWS secrets.
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.sqs.endpoint=http://localhost:4566
spring.cloud.aws.ses.endpoint=http://localhost:4566

# Existing team notification listener also uses the shared local SQS client.
aws.sqs.notification-queue-url=http://localhost:4566/queue/ap-northeast-2/000000000000/dropit-notification

# Complete local purchase path: Redis admission -> order SQS -> order finalization.
app.order.sqs.order-queue-url=http://localhost:4566/queue/ap-northeast-2/000000000000/dropit-order-queue
app.order.sqs.consumer-enabled=true

# SQS path endpoint generated by SQS_ENDPOINT_STRATEGY=path.
app.notification.email.sqs.queue-url=http://localhost:4566/queue/ap-northeast-2/000000000000/dropit-purchase-email
app.notification.email.sqs.publisher-enabled=true
app.notification.email.sqs.consumer-enabled=true

# LocalStack records the message instead of sending a real email.
app.notification.email.ses.from-address=no-reply@dropit.local
