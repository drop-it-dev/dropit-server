management.endpoint.health.show-details=never
spring.config.import=aws-parameterstore:/dropit-server/prod/
docs.swagger-ui.read-only=true

# These bounds are also enforced in PurchaseEmailSesClientConfig so values loaded
# from Parameter Store cannot exceed the SQS delivery claim/visibility window.
app.notification.email.ses.api-call-timeout-millis=20000
app.notification.email.ses.api-call-attempt-timeout-millis=5000
