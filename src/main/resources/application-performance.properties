# Buffer the short connection burst generated at Drop opening time.
# This profile is enabled only while measuring the local performance scenario.
server.tomcat.accept-count=10000
server.tomcat.max-connections=12000

# Let blocking HTTP requests wait on lightweight Java 21 virtual threads.
spring.threads.virtual.enabled=true

# Expose application metrics only in the local performance profile.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
