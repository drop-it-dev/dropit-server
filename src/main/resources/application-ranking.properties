spring.main.web-application-type=none
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=10000
spring.jdbc.template.query-timeout=300s
spring.data.redis.connect-timeout=${RANKING_REDIS_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${RANKING_REDIS_COMMAND_TIMEOUT:5s}

app.ranking.order-time-zone=${RANKING_ORDER_TIME_ZONE}
app.ranking.lock-ttl=${RANKING_LOCK_TTL:65m}
