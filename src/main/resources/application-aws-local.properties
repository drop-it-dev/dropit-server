# Run with the local profile to load .env.local, but use real AWS endpoints:
# --spring.profiles.active=local,aws-local

# The common configuration currently uses ddl-auto=create. Keep real AWS
# integration tests away from the developer's normal local database.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${AWS_TEST_DB_NAME:dropit_localstack}

# Avoid stale stock and per-user purchase counters from ordinary local runs.
spring.data.redis.database=${AWS_TEST_REDIS_DATABASE:15}
