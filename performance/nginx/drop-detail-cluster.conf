worker_processes auto;

events {
    worker_connections 16384;
}

http {
    upstream dropit_backend {
        least_conn;
        server dropit-performance-app-1:8080;
        server dropit-performance-app-2:8080;
        server dropit-performance-app-3:8080;
        server dropit-performance-app-4:8080;
        keepalive 256;
    }

    server {
        listen 8080 backlog=16384;

        location / {
            proxy_pass http://dropit_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
