worker_processes auto;

events {
    worker_connections 8192;
}

http {
    upstream dropit_backend {
        least_conn;
        server dropit-list-app-1:8080;
        server dropit-list-app-2:8080;
        keepalive 128;
    }

    server {
        listen 8080 backlog=8192;

        location / {
            proxy_pass http://dropit_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
